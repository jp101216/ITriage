[package]
name = "itriage-core"
version = "0.3.0"
edition = "2021"
description = "Platform-split IT triage + update engine. GUI-agnostic; the Tauri app (or the CLI example) is just a shell over this."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

# Native Win32 / COM: Service Control Manager, Event Log, Windows Update Agent,
# token elevation, registry, and ShellExecute (relaunch as admin).
# Pinned to the same major as Tauri's own `windows` dependency so the app only
# compiles the crate once.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
