[package]
name = "itriage-core"
version = "0.10.0"
edition = "2021"
description = "Platform-split IT triage + update engine. GUI-agnostic; the Tauri app (or the CLI example) is just a shell over this."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
toml = "1"
url = "2.5"
sha2 = "0.10"
regex = "1"
crc32fast = "1"

# Native Win32 / COM: Service Control Manager, Event Log, Windows Update Agent,
# printing, SetupAPI devices, WLAN, IP Helper (adapters, routes, ICMP),
# certificates, NetAPI, power, token elevation, registry, SMBIOS, PDH disk
# counters, the console session user, WinHTTP proxy settings, the Recycle
# Bin, ShellExecute (relaunch as admin), attaching to a console (CLI mode),
# the Credential Manager's list of saved credentials (names only), and
# file version resources (Edge's version).
# Pinned to the same major as Tauri's own `windows` dependency so the app only
# compiles the crate once.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
