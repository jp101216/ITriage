name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for this version, e.g. v0.4.0 (run on main). Leave empty for a normal build."
        required: false
        default: ""
        type: string

concurrency:
  # Per event too, so a release run and a push to main don't cancel each other.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test, smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      # Runs every read-only module for real on the runner. On windows-latest
      # this is what exercises the native SCM, Event Log, token, registry and
      # WUA code paths. Findings never fail the job; a crash does.
      - name: Smoke-run read-only modules
        shell: bash
        run: |
          cargo run -q -p itriage-core --example triage
          cargo run -q -p itriage-core --example triage -- --json > smoke-${{ runner.os }}.json

      # The example clinical profile: policy locks, site requirements (which
      # fail on a runner, as they should) and the workstation checks.
      - name: Smoke-run with the example site profile
        shell: bash
        env:
          ITRIAGE_PROFILE: profiles/clinical-workstation.example.toml
        run: |
          cargo run -q -p itriage-core --example triage -- --list
          cargo run -q -p itriage-core --example triage -- desk.time desk.printers desk.devices desk.wifi desk.battery site.apps site.checks

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-${{ runner.os }}
          path: smoke-${{ runner.os }}.json
          if-no-files-found: ignore

  # Every push gets installers (branch builds too, so a feature can be tried
  # on a real machine before it's merged); pull requests reuse the push build.
  # Publishing them as a release is the `release` job's work.
  bundle:
    name: Installers (${{ matrix.os }})
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: ubuntu-latest
            bundles: deb
    steps:
      - uses: actions/checkout@v7

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installers
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: itriage-${{ runner.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  # Publishes a GitHub Release with the installers attached, once, after both
  # installer builds pass. Two ways in:
  #   * Actions -> CI -> Run workflow on main, with `release` set to the
  #     version (e.g. v0.4.0): tags that commit and publishes the release.
  #   * Pushing a v* tag from a clone: makes a draft release to review first.
  # The tag must match the app version in tauri.conf.json, and the notes come
  # from release-notes/<tag>.md when that file exists.
  release:
    name: Publish release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version and pick the notes
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are published from main; this run is on ${GITHUB_REF#refs/heads/}."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' isn't a version tag like v1.2.3."
            exit 1
          fi
          want="v$(jq -r .version src-tauri/tauri.conf.json)"
          if [[ "$TAG" != "$want" ]]; then
            echo "::error::$TAG doesn't match the app version ($want in src-tauri/tauri.conf.json)."
            exit 1
          fi
          if [[ -f "release-notes/$TAG.md" ]]; then
            cp "release-notes/$TAG.md" notes.md
          else
            echo "itriage $TAG" > notes.md
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: itriage-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: itriage ${{ env.TAG }}
          body_path: notes.md
          draft: ${{ github.event_name == 'push' }}
          fail_on_unmatched_files: true
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.deb
