name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow as its build step.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a release build and
  # a push to main never cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Check the frontend and exercise fix workflows
        run: npm test

  check:
    name: Lint, test, smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      # Runs every read-only module for real on the runner. On windows-latest
      # this is what exercises the native SCM, Event Log, token, registry, IP
      # Helper, WinHTTP, PDH, SMBIOS, WUA, NetAPI, Credential Manager and
      # session code paths, and the PowerShell behind the security, drive
      # health and account checks. The last three lines run the two presets
      # without a script, a ticket (file name, audit log) and the trends. Findings never fail
      # the job, and neither does exit code 2 (a check that can't run on a
      # runner); a crash or exit 1 does. The second run diffs against the
      # first, so the history and compare code runs too.
      - name: Smoke-run read-only modules
        shell: bash
        run: |
          smoke() { set +e; "$@"; local code=$?; set -e; case $code in 0|2) ;; *) echo "::error::exit code $code from: $*"; return 1 ;; esac; }
          smoke cargo run -q -p itriage-core --example triage
          smoke cargo run -q -p itriage-core --example triage -- --json > smoke-${{ runner.os }}.json
          smoke cargo run -q -p itriage-core --example triage -- --preset triage --target github.com:443,80 --no-history
          smoke cargo run -q -p itriage-core --example triage -- --preset lockout --ticket CI-SMOKE
          smoke cargo run -q -p itriage-core --example triage -- --preset health --ticket CI-SMOKE --quiet > /dev/null
          cargo run -q -p itriage-core --example triage -- --trends

      # The changing presets in preview (what-if): every module that would
      # change the machine says what it would do and changes nothing.
      - name: Smoke-run previews
        shell: bash
        run: |
          smoke() { set +e; "$@"; local code=$?; set -e; case $code in 0|2) ;; *) echo "::error::exit code $code from: $*"; return 1 ;; esac; }
          smoke cargo run -q -p itriage-core --example triage -- --preset tuneup --what-if --no-history
          smoke cargo run -q -p itriage-core --example triage -- update.apply update.firmware fix.recycle fix.repair fix.restart --what-if --no-history

      # The example clinical profile: policy locks, site requirements (which
      # fail on a runner, as they should) and the workstation checks.
      - name: Smoke-run with the example site profile
        shell: bash
        env:
          ITRIAGE_PROFILE: profiles/clinical-workstation.example.toml
        run: |
          smoke() { set +e; "$@"; local code=$?; set -e; case $code in 0|2) ;; *) echo "::error::exit code $code from: $*"; return 1 ;; esac; }
          cargo run -q -p itriage-core --example triage -- --list
          smoke cargo run -q -p itriage-core --example triage -- desk.time desk.printers desk.devices desk.wifi desk.battery site.apps site.checks

      - name: Upload smoke report
        # Case evidence is checked locally in the job; only the standard
        # synthetic-runner smoke report is retained as an artifact.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-${{ runner.os }}
          path: smoke-${{ runner.os }}.json
          if-no-files-found: ignore

      - name: Smoke-test guided diagnostics, recording and case integrity
        shell: bash
        run: |
          smoke() { set +e; "$@"; local code=$?; set -e; case $code in 0|2) ;; *) echo "::error::exit code $code from: $*"; return 1 ;; esac; }
          python -c 'from pathlib import Path; Path("case-smoke.toml").write_text("[network]\npublic_probes = false\n", encoding="utf-8")'
          smoke cargo run -q -p itriage-core --example triage -- --runbook printing --no-history --out case-guided.json --quiet > /dev/null
          smoke cargo run -q -p itriage-core --example triage -- --runbook slow-pc --no-history --quiet > /dev/null
          ITRIAGE_PROFILE=case-smoke.toml smoke cargo run -q -p itriage-core --example triage -- --record 5 --interval-ms 1000 --no-history --out case-recording.json --quiet > /dev/null
          cargo run -q -p itriage-core --example triage -- --bundle-preview case-recording.json --out case-preview.json > /dev/null
          cargo run -q -p itriage-core --example triage -- --bundle case-recording.json --out case.zip
          python scripts/check-case.py case-recording.json case-preview.json case.zip

  # The installers carry THIRD-PARTY-NOTICES.txt: the licenses and copyright
  # notices of every crate built into them. It's generated from Cargo.lock, and
  # this fails when a dependency has changed without it (a release stops here
  # too). Nothing is compiled; cargo-about reads the crates' own license files.
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.3 --locked --features cli

      - name: Check THIRD-PARTY-NOTICES.txt is current
        run: scripts/third-party-notices.sh --check

  # Every push gets installers (branch builds too, so a feature can be tried
  # on a real machine before it's merged); pull requests reuse the push build.
  # Publishing them is release.yml's work.
  bundle:
    name: Installers (${{ matrix.os }})
    needs: [check, frontend]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: ubuntu-latest
            bundles: deb
    steps:
      - uses: actions/checkout@v7

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installers
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      # ITriage's license and the third-party notices have to travel with
      # every copy, so each installer is opened and checked for both.
      - name: Check the .deb carries the licenses
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb=$(ls target/release/bundle/deb/*.deb)
          listing=$(dpkg-deb -c "$deb")
          for f in LICENSE.txt THIRD-PARTY-NOTICES.txt; do
            line=$(grep -E "/$f\$" <<< "$listing" || true)
            echo "${line:-$f: not in the package}"
            if [[ "$line" != -r??r??r??\ * ]]; then
              echo "::error::$f isn't in $(basename "$deb"), or not everyone can read it."
              exit 1
            fi
          done

      - name: Check the Windows installers carry the licenses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wanted = 'LICENSE.txt', 'THIRD-PARTY-NOTICES.txt'
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $msi -or -not $setup) { throw "The MSI and setup installers weren't both built." }

          # The MSI, as it unpacks.
          $unpacked = Join-Path $env:RUNNER_TEMP 'msi-licenses'
          $p = Start-Process msiexec.exe -ArgumentList '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$unpacked`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Unpacking $($msi.Name) failed (msiexec exit code $($p.ExitCode))." }
          foreach ($f in $wanted) {
            $found = Get-ChildItem $unpacked -Recurse -Filter $f | Select-Object -First 1
            if (-not $found -or $found.Length -eq 0) { throw "$f isn't in $($msi.Name)." }
            "{0}: {1} ({2:N0} bytes)" -f $msi.Name, $found.FullName.Substring($unpacked.Length), $found.Length
          }

          # The setup program, as 7-Zip lists it.
          $listing = & 7z l $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "7-Zip couldn't list $($setup.Name) (exit code $LASTEXITCODE)." }
          foreach ($f in $wanted) {
            $line = $listing | Where-Object { $_ -match ('(\s|\\)' + [regex]::Escape($f) + '$') } | Select-Object -First 1
            if (-not $line) { throw "$f isn't in $($setup.Name)." }
            "{0}: {1}" -f $setup.Name, $line.Trim()
          }

      - uses: actions/upload-artifact@v7
        with:
          name: itriage-${{ runner.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
          if-no-files-found: error
