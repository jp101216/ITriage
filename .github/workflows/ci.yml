name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow as its build step.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a release build and
  # a push to main never cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test, smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      # Runs every read-only module for real on the runner. On windows-latest
      # this is what exercises the native SCM, Event Log, token, registry, IP
      # Helper, WinHTTP, PDH, SMBIOS and WUA code paths. Findings never fail
      # the job, and neither does exit code 2 (a check that can't run on a
      # runner); a crash or exit 1 does. The second run diffs against the
      # first, so the history and compare code runs too.
      - name: Smoke-run read-only modules
        shell: bash
        run: |
          smoke() { set +e; "$@"; local code=$?; set -e; case $code in 0|2) ;; *) echo "::error::exit code $code from: $*"; return 1 ;; esac; }
          smoke cargo run -q -p itriage-core --example triage
          smoke cargo run -q -p itriage-core --example triage -- --json > smoke-${{ runner.os }}.json
          smoke cargo run -q -p itriage-core --example triage -- --preset triage --target github.com:443,80 --no-history

      # The changing presets in preview (what-if): every module that would
      # change the machine says what it would do and changes nothing.
      - name: Smoke-run previews
        shell: bash
        run: |
          smoke() { set +e; "$@"; local code=$?; set -e; case $code in 0|2) ;; *) echo "::error::exit code $code from: $*"; return 1 ;; esac; }
          smoke cargo run -q -p itriage-core --example triage -- --preset tuneup --what-if --no-history
          smoke cargo run -q -p itriage-core --example triage -- update.apply update.firmware fix.recycle fix.repair fix.restart --what-if --no-history

      # The example clinical profile: policy locks, site requirements (which
      # fail on a runner, as they should) and the workstation checks.
      - name: Smoke-run with the example site profile
        shell: bash
        env:
          ITRIAGE_PROFILE: profiles/clinical-workstation.example.toml
        run: |
          smoke() { set +e; "$@"; local code=$?; set -e; case $code in 0|2) ;; *) echo "::error::exit code $code from: $*"; return 1 ;; esac; }
          cargo run -q -p itriage-core --example triage -- --list
          smoke cargo run -q -p itriage-core --example triage -- desk.time desk.printers desk.devices desk.wifi desk.battery site.apps site.checks

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-${{ runner.os }}
          path: smoke-${{ runner.os }}.json
          if-no-files-found: ignore

  # Every push gets installers (branch builds too, so a feature can be tried
  # on a real machine before it's merged); pull requests reuse the push build.
  # Publishing them is release.yml's work.
  bundle:
    name: Installers (${{ matrix.os }})
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: ubuntu-latest
            bundles: deb
    steps:
      - uses: actions/checkout@v7

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installers
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: itriage-${{ runner.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
          if-no-files-found: error
