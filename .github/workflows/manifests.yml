name: Event manifests (scratch)
on: push
permissions:
  contents: read
jobs:
  watch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/phase5-wip
      - name: Build the command line
        shell: pwsh
        run: cargo build -q -p itriage-core --example triage
      - name: Install and uninstall the watch task
        shell: pwsh
        run: |
          $exe = Resolve-Path target\debug\examples\triage.exe
          "===== install"; & $exe --install-watch; "exit $LASTEXITCODE"
          "===== query"; schtasks /Query /TN "ITriage Watch" /XML; "exit $LASTEXITCODE"
          "===== query list"; schtasks /Query /TN "ITriage Watch" /V /FO LIST
          "===== uninstall"; & $exe --uninstall-watch; "exit $LASTEXITCODE"
          "===== query after"; schtasks /Query /TN "ITriage Watch" 2>&1; "exit $LASTEXITCODE"
          "===== uninstall again"; & $exe --uninstall-watch; "exit $LASTEXITCODE"
          "===== audit"; Get-Content "$env:LOCALAPPDATA\itriage\audit.jsonl" -Tail 3
      - name: A real Application Error 1000
        shell: pwsh
        run: |
          Start-Process powershell -ArgumentList '-NoProfile','-Command','[Environment]::FailFast(\"itriage watch test\")' -Wait
          Start-Sleep 10
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 2 -ErrorAction SilentlyContinue | ForEach-Object { "---- $($_.ProviderName) $($_.Id)"; $_.ToXml() }
      - name: Watch catches a crash and a busy processor
        shell: pwsh
        run: |
          $exe = Resolve-Path target\debug\examples\triage.exe
          @"
          [advanced]
          watch = true
          watch_triggers = ["app_hang"]
          "@ | Set-Content "$env:RUNNER_TEMP\hang.toml"
          $env:ITRIAGE_PROFILE = "$env:RUNNER_TEMP\hang.toml"
          $w = Start-Process $exe -ArgumentList '--watch' -PassThru -RedirectStandardError "$env:RUNNER_TEMP\watch1.err"
          Start-Sleep 20
          Start-Process powershell -ArgumentList '-NoProfile','-Command','[Environment]::FailFast(\"itriage watch test 2\")' -Wait
          Start-Sleep 40
          Stop-Process $w -Force
          "===== watch 1 stderr"; Get-Content "$env:RUNNER_TEMP\watch1.err"
          @"
          [thresholds]
          cpu_pct = { warn = 1, crit = 99 }
          [advanced]
          watch = true
          watch_triggers = ["cpu", "gateway_loss"]
          "@ | Set-Content "$env:RUNNER_TEMP\cpu.toml"
          $env:ITRIAGE_PROFILE = "$env:RUNNER_TEMP\cpu.toml"
          $busy = Start-Process pwsh -ArgumentList '-NoProfile','-Command','$e=(Get-Date).AddSeconds(100); while((Get-Date) -lt $e){}' -PassThru
          $w = Start-Process $exe -ArgumentList '--watch' -PassThru -RedirectStandardError "$env:RUNNER_TEMP\watch2.err"
          Start-Sleep 90
          Stop-Process $w -Force; Stop-Process $busy -Force -ErrorAction SilentlyContinue
          "===== watch 2 stderr"; Get-Content "$env:RUNNER_TEMP\watch2.err"
          "===== off"
          $env:ITRIAGE_PROFILE = ""
          & $exe --watch; "exit $LASTEXITCODE"
          "===== captures"
          Get-ChildItem "$env:LOCALAPPDATA\itriage\history" | Select-Object Name, Length
          Get-ChildItem "$env:LOCALAPPDATA\itriage\history\*_watch*.txt" | ForEach-Object { "######## $($_.Name)"; Get-Content $_ | Select-Object -First 40 }
