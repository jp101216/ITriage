name: Event manifests (scratch)
on: push
permissions:
  contents: read
jobs:
  dump:
    runs-on: windows-latest
    steps:
      - name: Dump event templates
        shell: pwsh
        run: |
          $want = [ordered]@{
            'Microsoft-Windows-Security-Kerberos' = @(3,4)
            'Microsoft-Windows-AppLocker' = @(8004)
            'Microsoft-Windows-User Profiles Service' = @(1,2)
            'Microsoft-Windows-Kernel-Processor-Power' = @(37)
            'Microsoft-Windows-GroupPolicy' = @(5016,5312,8001,1129)
            'Microsoft-Windows-Wired-AutoConfig' = @(15514)
            'Microsoft-Windows-WHEA-Logger' = @(17,19,47)
            'Microsoft-Windows-CodeIntegrity' = @(3077)
          }
          foreach ($name in $want.Keys) {
            try {
              $p = New-Object System.Diagnostics.Eventing.Reader.ProviderMetadata($name)
              foreach ($e in @($p.Events)) {
                $id = [int64]$e.Id -band 0xFFFF
                if ($want[$name] -notcontains $id) { continue }
                "===== $name $id (raw $([int64]$e.Id)) v$($e.Version) level=$($e.Level.Name) channel=$($e.LogLink.LogName)"
                "TEMPLATE: $($e.Template)"
                "MESSAGE: $($e.Description)"
              }
            } catch { "ERROR $name $($_.Exception.Message)" }
          }
          wevtutil gp "Microsoft-Windows-AppLocker" /ge /f:xml | Select-String -Pattern 'RuleAndFileData|UserData' -Context 0,3 | Select-Object -First 6
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Format-List
