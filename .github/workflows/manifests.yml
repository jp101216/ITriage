name: Event manifests (scratch)
on: push
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: realm, sssd, adcli, klist
        shell: bash {0}
        run: |
          set +e
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq realmd sssd sssd-tools adcli krb5-user packagekit >/dev/null 2>&1 || true
          realm --version || true
          realm list; echo "realm list exit $?"
          sudo tee /etc/krb5.conf >/dev/null <<'EOF'
          [libdefaults]
            default_realm = CORP.EXAMPLE.ORG
            dns_lookup_kdc = false
          [realms]
            CORP.EXAMPLE.ORG = {
              kdc = 192.0.2.10
            }
          EOF
          printf 'addent -password -p WS-07$@CORP.EXAMPLE.ORG -k 3 -e aes256-cts-hmac-sha1-96\nhunter2\naddent -password -p host/ws-07.corp.example.org@CORP.EXAMPLE.ORG -k 3 -e aes256-cts-hmac-sha1-96\nhunter2\naddent -password -p host/WS-07@CORP.EXAMPLE.ORG -k 2 -e aes128-cts-hmac-sha1-96\nhunter2\nwkt /tmp/test.keytab\nquit\n' | ktutil
          echo "===== klist -k"; klist -k /tmp/test.keytab
          echo "===== klist -k -t -e"; klist -k -t -e /tmp/test.keytab
          sudo cp /tmp/test.keytab /etc/krb5.keytab
          sudo tee /etc/sssd/sssd.conf >/dev/null <<'EOF'
          [sssd]
          domains = corp.example.org
          config_file_version = 2
          services = nss, pam, ifp

          [domain/corp.example.org]
          ad_domain = corp.example.org
          krb5_realm = CORP.EXAMPLE.ORG
          realmd_tags = manages-system joined-with-adcli
          cache_credentials = True
          id_provider = ad
          krb5_store_password_if_offline = True
          default_shell = /bin/bash
          ldap_id_mapping = True
          use_fully_qualified_names = True
          fallback_homedir = /home/%u@%d
          access_provider = ad
          ad_server = 192.0.2.10
          EOF
          sudo chmod 600 /etc/sssd/sssd.conf
          sudo systemctl restart sssd; echo "sssd restart exit $?"
          sleep 8
          systemctl is-active sssd || true
          echo "===== realm list"; realm list; echo "exit $?"
          echo "===== realm list --name-only"; realm list --name-only; echo "exit $?"
          echo "===== sssctl domain-list"; sudo sssctl domain-list; echo "exit $?"
          echo "===== sssctl domain-status"; sudo sssctl domain-status corp.example.org; echo "exit $?"
          echo "===== sssctl domain-status -o"; sudo sssctl domain-status -o corp.example.org; echo "exit $?"
          echo "===== sssctl domain-status as user"; sssctl domain-status corp.example.org; echo "exit $?"
          echo "===== adcli testjoin"; sudo timeout 30 adcli testjoin; echo "exit $?"
          echo "===== adcli testjoin -D"; sudo timeout 30 adcli testjoin -D corp.example.org; echo "exit $?"
          echo "===== adcli testjoin as user"; timeout 30 adcli testjoin; echo "exit $?"
          echo "===== sssd.conf 0644"; sudo chmod 644 /etc/sssd/sssd.conf; sudo systemctl restart sssd; echo "restart exit $?"; sudo journalctl -u sssd -n 8 --no-pager
          echo "===== sssctl config-check"; sudo sssctl config-check; echo "exit $?"
          echo "===== no ifp"; sudo chmod 600 /etc/sssd/sssd.conf; sudo sed -i 's/services = nss, pam, ifp/services = nss, pam/' /etc/sssd/sssd.conf; sudo systemctl restart sssd; sleep 5; sudo sssctl domain-status corp.example.org; echo "exit $?"
          echo "===== realm list after stop"; sudo systemctl stop sssd; realm list; echo "exit $?"
