name: Event manifests (scratch)
on: push
permissions:
  contents: read
jobs:
  dump:
    runs-on: windows-latest
    steps:
      - name: Policy definitions and power settings
        shell: pwsh
        run: |
          $admx = Get-ChildItem C:\Windows\PolicyDefinitions\*.admx
          foreach ($pat in 'WindowsProtectedPrint', 'RestrictDriverInstallationToAdministrators', 'PackagePointAndPrintOnly', 'PackagePointAndPrintServerList', 'NoWarningNoElevationOnInstall', 'TrustedServers', 'ServerList') {
            "===== $pat"
            Select-String -Path $admx -Pattern $pat -Context 2,4 | Select-Object -First 3 | ForEach-Object { "--- $($_.Filename):$($_.LineNumber)"; $_.Context.PreContext; $_.Line; $_.Context.PostContext }
          }
          "===== USB selective suspend"
          powercfg /qh SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226
          "===== Edge version"
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}' -ErrorAction SilentlyContinue | Select-Object pv, name | Format-List
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\Edge\Application' -ErrorAction SilentlyContinue | Select-Object Name
          "===== Wired AutoConfig"
          Get-Service dot3svc | Format-List Name, Status, StartType
          Start-Service dot3svc -ErrorAction SilentlyContinue
          netsh lan show interfaces
          netsh lan show settings
          "===== AAD broker"
          Test-Path C:\Windows\SystemApps\Microsoft.AAD.BrokerPlugin_cw5n1h2txyewy
