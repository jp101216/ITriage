name: Release

# Publishes a GitHub Release with the Windows and Linux installers.
#
#   * Actions -> Release -> Run workflow (on main). Nothing to type: it
#     releases the version in src-tauri/tauri.conf.json and tags the commit
#     it built. It stops if that version has already been released. Tick
#     "Dry run" to build (and sign) without publishing anything.
#   * Pushing a vX.Y.Z tag from a clone does the same, but leaves the release
#     as a draft to review first. The tag must match the app version.
#
# The full CI workflow (lint, tests, smoke runs, installers) runs first, and
# the notes come from release-notes/<tag>.md when that file exists.
#
# Code signing: once the ARTIFACT_SIGNING_* and AZURE_* repository variables
# are set (see "Code signing" in the README), the Windows installers are
# rebuilt and signed with Azure Artifact Signing, and the signed files are
# the ones published. Azure sign-in is OIDC, so no secret is stored here.
# Every release also gets SHA256SUMS.txt and a build-provenance attestation
# for each file.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and sign, but don't publish"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    uses: ./.github/workflows/ci.yml

  sign-windows:
    name: Sign Windows installers
    needs: build
    # Skipped until code signing is set up.
    if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
    runs-on: windows-latest
    # Azure accepts sign-ins from this environment only (the subject of the
    # app registration's federated credential).
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      # Microsoft's signtool plug-in for Artifact Signing, from NuGet.
      DLIB_VERSION: "1.0.146"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Sign in to Azure (OIDC, no stored secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Set up signtool with Artifact Signing
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($v in 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE') {
            if (-not [Environment]::GetEnvironmentVariable($v)) {
              throw "The ARTIFACT_$v repository variable isn't set (see Code signing in the README)."
            }
          }
          $work = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          New-Item -ItemType Directory -Force $work | Out-Null
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/$env:DLIB_VERSION" -OutFile "$work\client.zip"
          Expand-Archive "$work\client.zip" -DestinationPath "$work\client" -Force
          $dlib = Get-ChildItem "$work\client" -Recurse -Filter 'Azure.CodeSigning.Dlib.dll' |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $dlib) { throw "Azure.CodeSigning.Dlib.dll (x64) isn't in Microsoft.ArtifactSigning.Client $env:DLIB_VERSION." }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -as [version] } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe isn't on this runner." }
          "signtool: $($signtool.FullName)"
          "dlib:     $($dlib.FullName)"

          # Sign in only with the Azure CLI session from the step above.
          $metadata = Join-Path $work 'metadata.json'
          [ordered]@{
            Endpoint               = $env:SIGNING_ENDPOINT
            CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE
            CorrelationId          = "itriage-release-$env:GITHUB_RUN_ID"
            ExcludeCredentials     = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content $metadata -Encoding utf8

          # Tauri runs this for the app, the uninstaller and both installers ("%1" is the file).
          $config = Join-Path $work 'tauri-sign.json'
          @{ bundle = @{ windows = @{ signCommand = @{
                cmd  = $signtool.FullName
                args = @('sign', '/v', '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
                         '/dlib', $dlib.FullName, '/dmdf', $metadata, '%1')
          } } } } | ConvertTo-Json -Depth 6 | Set-Content $config -Encoding utf8
          "SIGN_CONFIG=$config" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build signed installers
        shell: pwsh
        run: cargo tauri build --bundles msi,nsis --config $env:SIGN_CONFIG

      # Tauri signs the app inside each installer, then puts the unsigned copy
      # back in target/release, so the app is checked as the MSI unpacks it.
      - name: Check every signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $msi -or -not $setup) { throw "The MSI and setup installers weren't both built." }
          $unpacked = Join-Path $env:RUNNER_TEMP 'msi-unpacked'
          $p = Start-Process msiexec.exe -ArgumentList '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$unpacked`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Unpacking $($msi.Name) failed (msiexec exit code $($p.ExitCode))." }
          $app = Get-ChildItem $unpacked -Recurse -Filter itriage.exe | Select-Object -First 1
          if (-not $app) { throw "itriage.exe wasn't found inside $($msi.Name)." }
          $bad = 0
          $signer = ''
          foreach ($f in @($msi, $setup, $app)) {
            $s = Get-AuthenticodeSignature $f.FullName
            $who = if ($s.SignerCertificate) { $s.SignerCertificate.GetNameInfo('SimpleName', $false) } else { 'nobody' }
            "{0}: {1}, signed by {2}, timestamped: {3}" -f $f.Name, $s.Status, $who, [bool]$s.TimeStamperCertificate
            if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate) { $bad++ } else { $signer = $who }
          }
          if ($bad) { throw "$bad file(s) aren't validly signed and timestamped." }
          "::notice::Windows installers signed by $signer"

      - uses: actions/upload-artifact@v7
        with:
          # Not "itriage-*", so the publish job's first download skips it.
          name: signed-Windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, sign-windows]
    # Publishes when the build passed and signing either worked or isn't set up.
    if: ${{ !cancelled() && !inputs.dry_run && needs.build.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version and notes
        shell: bash
        run: |
          version="v$(jq -r .version src-tauri/tauri.conf.json)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "$version" ]]; then
              echo "::error::Tag $tag doesn't match the app version ($version in src-tauri/tauri.conf.json)."
              exit 1
            fi
            draft=true
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Releases are published from main; this run is on $GITHUB_REF_NAME."
              exit 1
            fi
            tag="$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag has already been released. Bump the version first (see Releasing in the README)."
              exit 1
            fi
            draft=false
          fi
          if [[ -f "release-notes/$tag.md" ]]; then
            cp "release-notes/$tag.md" notes.md
          else
            echo "itriage $tag" > notes.md
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "DRAFT=$draft" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: itriage-*
          path: dist
          merge-multiple: true

      - name: Swap in the signed Windows installers
        if: needs.sign-windows.result == 'success'
        shell: bash
        run: rm -rf dist/msi dist/nsis

      - if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: signed-Windows
          path: dist

      - name: Checksums
        shell: bash
        run: |
          cd dist
          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' \) -print0 | sort -z |
            while IFS= read -r -d '' f; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
            done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [[ "${{ needs.sign-windows.result }}" != "success" ]]; then
            echo "::warning::The Windows installers are unsigned: code signing isn't set up (see Code signing in the README)."
          fi

      - name: Build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.deb

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: itriage ${{ env.TAG }}
          body_path: notes.md
          draft: ${{ env.DRAFT }}
          fail_on_unmatched_files: true
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.deb
            dist/SHA256SUMS.txt
