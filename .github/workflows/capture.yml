name: data capture (throwaway)
on:
  push:
    branches: ["scratch/data-capture-*"]
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        shell: powershell
        run: ./capture.ps1
      - name: Show
        if: always()
        shell: bash
        run: for f in out/*.txt; do echo "################ $f"; cat "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture
          path: out/
