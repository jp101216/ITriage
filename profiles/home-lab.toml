# Example site profile: a home lab. The hosts are placeholders for your own.
#
# Use it per-user (~/.config/itriage/profile.toml, or %APPDATA%\itriage\profile.toml
# on Windows), or point ITRIAGE_PROFILE at it to try it out.

name = "Home lab"
description = "Workstations and servers on the lab network"

[policy]
# Your own gear: every module and every fix is allowed.
allow_changes = true
allow_installs = true

[time]
# Your router or a local NTP server works too.
server = "pool.ntp.org"

[network]
# Time a lookup of a lab name as well; the public checks stay on.
dns_probe = "pve.lan"
# Ports the destination test tries when you don't give any.
target_ports = [22, 443, 445, 8006]

[updates]
# Also install Windows Update drivers after the manufacturer's tool, as
# Invoke-UpdateSystem does. The default ("auto") uses them only when there's
# no manufacturer tool, so the two don't keep replacing each other's drivers.
windows_update_drivers = "always"

[history]
keep = 0   # keep every run

[[require.service]]
# A systemd unit on Linux; on Windows use the service name (OpenSSH Server is "sshd").
name = "sshd"
label = "SSH server"

[[require.endpoint]]
label = "NAS (SMB)"
host = "nas.lan"
port = 445

[[require.endpoint]]
label = "Proxmox web UI"
host = "pve.lan"
port = 8006

[[require.endpoint]]
label = "Pi-hole DNS"
host = "pihole.lan"
port = 53

[[require.endpoint]]
label = "Internet (HTTPS)"
host = "example.com"
port = 443
