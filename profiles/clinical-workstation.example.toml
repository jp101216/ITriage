# Example site profile: a shared clinical workstation.
#
# Every host name, service and article below is a PLACEHOLDER. Replace them
# with the values from your own environment's documentation before using it.
#
# Deploy it machine-wide, where only administrators can edit it:
#   Windows: %ProgramData%\itriage\profile.toml
#   Linux:   /etc/itriage/profile.toml
# A machine-wide profile always wins over a per-user one, and if it doesn't
# parse, itriage runs read-only rather than ignoring it.

name = "Clinical workstation (example)"
description = "Shared nursing-unit PC: badge-tap sign-in, virtual desktop, label printer"

[policy]
# Patching comes from the management platform, so the install modules are locked.
allow_installs = false
# Only these one-click fixes can run. Delete a line to switch that fix off.
# "start-service:<name>" allows starting that one service only.
fixes = [
  "restart-spooler",
  "clear-print-queue",
  "resync-time",
  "gpupdate",
  "flush-dns",
  "start-service:Spooler",
  "start-service:W32Time",
]
# Open in the simple self-service view. Set technician_view = false to keep
# the app in self-service mode (a kiosk for end users).
start_in = "self-service"
technician_view = true
# Start in remote-safe mode, like Invoke-EndpointTuneUp -RemoteSafe: adapter
# restarts, DHCP renew, cache purges, policy triggers and restarts stay
# locked until a technician switches remote-safe off for that session.
remote_safe = true

[time]
# The clock is measured against this server (usually a domain controller).
server = "dc01.example.org"
# Windows zone name or IANA name ("America/Detroit"); a mismatch is flagged.
zone = "Eastern Standard Time"

[network]
# Invoke-NetTriage's built-in public checks: a timed lookup of
# www.microsoft.com, a TCP connect to 8.8.8.8:53 and the public IP from
# ifconfig.me. Like -SkipPublicProbes, false turns them off; the probes set
# below and the endpoints under [[require.endpoint]] still run.
public_probes = false
dns_probe = "intranet.example.org"
tcp_probe = "ehr-gateway.example.org:443"
# egress_url = ""                       # "" skips the public-IP lookup
# target_ports = [443, 80, 445, 3389]   # the destination test's default ports
# tcp_timeout_ms = 1500                 # per TCP check, across all its addresses
# ping_count = 4
# ping_timeout_ms = 1000

# Alert levels, as { warn, crit }. These are Invoke-NetTriage's defaults;
# uncomment a line to change it. Disk free and Wi-Fi signal: lower is worse.
[thresholds]
# uptime_days     = { warn = 7,   crit = 14 }
# cpu_pct         = { warn = 75,  crit = 90 }
# memory_pct      = { warn = 80,  crit = 90 }
# disk_free_pct   = { warn = 15,  crit = 10 }
# disk_latency_ms = { warn = 15,  crit = 30 }
# wifi_signal_pct = { warn = 70,  crit = 50 }
# gateway_rtt_ms  = { warn = 20,  crit = 50 }
# network_rtt_ms  = { warn = 80,  crit = 150 }   # DNS servers and destinations
# dns_ms          = { warn = 100, crit = 300 }
# packet_loss_pct = { warn = 1,   crit = 10 }

[privacy]
# Show REDACTED instead of the serial number in results and exports.
redact_serial = false

[cleanup]
# Temp files created or changed more recently than this are kept.
temp_min_age_hours = 24

[history]
# Saved runs kept on this PC (0 keeps every run).
keep = 100

[[require.service]]
name = "Spooler"
label = "Print Spooler"

[[require.service]]
name = "W32Time"
label = "Windows Time"

[[require.app]]
# Matched against installed program names, case-insensitively.
name = "Citrix Workspace"
min_version = "24.2"

[[require.app]]
name = "Imprivata"
label = "Badge-tap SSO agent"

[[require.endpoint]]
label = "EHR gateway"
host = "ehr-gateway.example.org"
port = 443

[[require.endpoint]]
label = "Print server"
host = "print01.example.org"
port = 445

[[require.device]]
# Matched against device names, case-insensitively.
label = "Badge reader"
match = "pcProx"

[[require.device]]
label = "Dictation microphone"
match = "PowerMic"

# Knowledge-base links, attached to findings that need attention.
# `module` limits a rule to one module; `match` is a case-insensitive
# substring of the finding's label, value or detail.
[[kb]]
module = "desk.printers"
match = "stuck"
title = "Clear a stuck print queue"
url = "https://kb.example.org/printing/stuck-queue"

[[kb]]
module = "desk.time"
match = "Offset"
title = "Clock drift and sign-in failures"
url = "https://kb.example.org/windows/time-sync"

[[kb]]
module = "desk.wifi"
match = "Signal"
title = "Report a Wi-Fi dead spot"
url = "https://kb.example.org/network/wifi-coverage"
