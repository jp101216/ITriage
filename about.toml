# What scripts/third-party-notices.sh (cargo-about) may put in
# THIRD-PARTY-NOTICES.txt. A dependency under any other license stops the
# script, so a new license is a decision and not a surprise.
#
# The order matters: where a crate offers a choice ("MIT OR Apache-2.0"), the
# first license listed here that satisfies it is the one ITriage takes.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # A public-domain dedication. Only dunce, below.
    "CC0-1.0",
    # File-level copyleft: fine while the crates are used unmodified, which
    # they are (they come from crates.io as published).
    "MPL-2.0",
]

# The builds that are shipped. Crates only compiled for other systems are left out.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# Test-only crates are never in an installer.
ignore-dev-dependencies = true

# ITriage's own crates are covered by LICENSE.
private = { ignore = true }

# ---------------------------------------------------------------------------
# Clarifications: crates whose license text cargo-about can't find by itself.
# Without one it prints the license's standard text with "<year> <copyright
# holders>" where the crate's own notice should be. Each names the file to
# use and its SHA-256; when a new version changes that file, the script stops
# and the checksum here needs a look. (Crate tables must stay at the end.)
# ---------------------------------------------------------------------------

# These crates' packages have a license file that says something other than
# the first choice above, so the license the file is for is the one taken.


[dunce.clarify]
license = "CC0-1.0"

[[dunce.clarify.files]]
path = "LICENSE"
checksum = "a2010f343487d3f7618affe54f789f5487602331c0a8d03f49e9a7c547cf0499"

